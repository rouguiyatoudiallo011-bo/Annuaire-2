<section>
    @if (service.loading()) {
        <p>Chargement en cours</p>
    }
    @else if (people()) {
        @for (person of this.people(); track person.login.uuid) {
            <a [routerLink]="['/personnes', person.login.uuid]">
            <app-person-cart [person]= "person"/>
            </a>
        }
    }
      @else if (people === null){
    <p>L'annuaire est indisponible. Réessaie dans un instant.</p>
  }
</section>
